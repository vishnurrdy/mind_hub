<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mind Hub - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/i18n.js"></script>
  </head>
  <body class="bg-gray-100 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto p-6">
      <a
        href="Dashboard.html"
        class="text-teal-600 hover:underline"
        data-i18n="back_dashboard"
        >← Back to Dashboard</a
      >
      <h1 class="text-2xl font-bold mt-4" data-i18n="site_name">Mind Hub</h1>
      <p class="text-gray-600 mt-1">
        View and edit your profile information (demo).
      </p>

      <div class="mt-6 bg-white rounded-lg shadow p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <div
              id="emailDisplay"
              class="mt-1 text-lg font-semibold text-gray-900"
            ></div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700"
              >Full name</label
            >
            <input
              id="fullName"
              type="text"
              class="mt-1 block w-full rounded-md border-gray-200"
              placeholder="Your full name"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700"
              >Date of birth</label
            >
            <input
              id="dob"
              type="date"
              class="mt-1 block w-full rounded-md border-gray-200"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Phone</label>
            <input
              id="phone"
              type="tel"
              class="mt-1 block w-full rounded-md border-gray-200"
              placeholder="+1 555 555 5555"
            />
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700"
              >Address</label
            >
            <input
              id="address"
              type="text"
              class="mt-1 block w-full rounded-md border-gray-200"
              placeholder="Street, City, State"
            />
          </div>
        </div>

        <hr class="my-4" />

        <form id="profileForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700"
              >Change password</label
            >
            <input
              id="newPassword"
              type="password"
              class="mt-1 block w-full rounded-md border-gray-200"
              placeholder="Enter a new password (demo)"
              minlength="6"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700"
              >Confirm password</label
            >
            <input
              id="confirmPassword"
              type="password"
              class="mt-1 block w-full rounded-md border-gray-200"
              placeholder="Confirm password"
              minlength="6"
            />
          </div>
          <div class="flex items-center gap-3">
            <button
              type="submit"
              class="bg-teal-600 text-white px-4 py-2 rounded"
            >
              Save profile
            </button>
            <button
              type="button"
              id="cancelProfile"
              class="bg-gray-200 px-4 py-2 rounded"
            >
              Reset
            </button>
            <span id="pmsg" class="text-sm"></span>
          </div>
        </form>

        <hr class="my-4" />

        <div>
          <h3 class="text-lg font-semibold">Previous passwords (demo)</h3>
          <p class="text-sm text-gray-500">
            A history of previous password hashes (for demo only; hashed
            light-weightly).
          </p>
          <ul id="pwHistory" class="mt-2 space-y-2 text-sm text-gray-700"></ul>
        </div>

        <hr class="my-4" />

        <div>
          <h3 class="text-lg font-semibold">Medical certificates</h3>
          <p class="text-sm text-gray-500">
            Upload medical certificates (PDF/images). Files are stored locally
            in your browser.
          </p>
          <div class="mt-3 flex gap-3 items-center">
            <input id="certFile" type="file" accept="application/pdf,image/*" />
            <button
              id="uploadCert"
              class="bg-teal-600 text-white px-3 py-1 rounded"
            >
              Upload
            </button>
          </div>
          <ul id="certList" class="mt-3 space-y-3"></ul>
        </div>
      </div>
    </div>

    <script>
      // Load user from localStorage and protect the page
      function getUser() {
        try {
          return JSON.parse(localStorage.getItem("wh_user") || "null");
        } catch (e) {
          return null;
        }
      }
      function saveUser(email, password) {
        const token = btoa(email + ":" + password.split("").reverse().join(""));
        localStorage.setItem("wh_user", JSON.stringify({ email, token }));
      }

      const user = getUser();
      if (!user) {
        window.location.href = "Login/index.html";
      }
      document.getElementById("emailDisplay").textContent = user
        ? user.email
        : "Not signed in";

      // Load profile details from localStorage (per user)
      function profileKey(email) {
        return `wh_profile_${email}`;
      }
      function loadProfile() {
        const p = JSON.parse(
          localStorage.getItem(profileKey(user.email)) || "{}"
        );
        return p;
      }
      function saveProfile(p) {
        localStorage.setItem(profileKey(user.email), JSON.stringify(p));
      }

      // Load certificate store
      function certKey(email) {
        return `wh_certs_${email}`;
      }
      function loadCerts() {
        try {
          return JSON.parse(localStorage.getItem(certKey(user.email)) || "[]");
        } catch (e) {
          return [];
        }
      }
      function saveCerts(list) {
        localStorage.setItem(certKey(user.email), JSON.stringify(list));
      }

      // Password history utility (light-weight hash)
      function lightHash(s) {
        return btoa(s.split("").reverse().join("") + "::salt");
      }

      // Populate profile fields
      const profile = loadProfile();
      if (profile.name)
        document.getElementById("fullName").value = profile.name;
      if (profile.dob) document.getElementById("dob").value = profile.dob;
      if (profile.phone) document.getElementById("phone").value = profile.phone;
      if (profile.address)
        document.getElementById("address").value = profile.address;

      // Populate password history
      function renderPwHistory() {
        const ul = document.getElementById("pwHistory");
        ul.innerHTML = "";
        const meta = JSON.parse(
          localStorage.getItem(`wh_pwmeta_${user.email}`) || "[]"
        );
        if (!meta.length) {
          ul.innerHTML =
            '<li class="text-sm text-gray-500">No previous passwords recorded.</li>';
          return;
        }
        meta.forEach((m, i) => {
          const li = document.createElement("li");
          li.className = "flex justify-between items-center";
          li.innerHTML = `<span class="text-sm">${i + 1}. ${
            m.date
          } — <code class=\"text-xs\">${m.hash.slice(0, 8)}...</code></span>`;
          ul.appendChild(li);
        });
      }
      renderPwHistory();

      // Populate cert list
      function renderCerts() {
        const list = loadCerts();
        const ul = document.getElementById("certList");
        ul.innerHTML = "";
        if (!list.length) {
          ul.innerHTML =
            '<li class="text-sm text-gray-500">No certificates uploaded.</li>';
          return;
        }
        list.forEach((c, idx) => {
          const li = document.createElement("li");
          li.className = "flex items-center justify-between gap-3";
          const left = document.createElement("div");
          left.innerHTML = `<div class=\"font-medium\">${
            c.name
          }</div><div class=\"text-sm text-gray-500\">Uploaded: ${new Date(
            c.ts
          ).toLocaleString()}</div>`;
          const actions = document.createElement("div");
          const aView = document.createElement("a");
          aView.href = c.data;
          aView.target = "_blank";
          aView.className = "text-teal-600 hover:underline text-sm mr-3";
          aView.textContent = "View";
          const aDl = document.createElement("a");
          aDl.href = c.data;
          aDl.download = c.name;
          aDl.className = "text-teal-600 hover:underline text-sm mr-3";
          aDl.textContent = "Download";
          const aRm = document.createElement("button");
          aRm.className = "text-red-600 text-sm";
          aRm.textContent = "Remove";
          aRm.addEventListener("click", () => {
            list.splice(idx, 1);
            saveCerts(list);
            renderCerts();
          });
          actions.appendChild(aView);
          actions.appendChild(aDl);
          actions.appendChild(aRm);
          li.appendChild(left);
          li.appendChild(actions);
          ul.appendChild(li);
        });
      }
      renderCerts();

      // Handle profile save
      document.getElementById("profileForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const msg = document.getElementById("pmsg");
        const name = document.getElementById("fullName").value.trim();
        const dob = document.getElementById("dob").value;
        const phone = document.getElementById("phone").value.trim();
        const address = document.getElementById("address").value.trim();
        const np = document.getElementById("newPassword").value;
        const cp = document.getElementById("confirmPassword").value;
        if (np && np.length < 6) {
          msg.textContent = "Password must be at least 6 characters.";
          msg.className = "text-sm text-red-600";
          return;
        }
        if (np && np !== cp) {
          msg.textContent = "Passwords do not match.";
          msg.className = "text-sm text-red-600";
          return;
        }

        // Save profile
        const p = { name, dob, phone, address, updated: Date.now() };
        saveProfile(p);

        // Update password and record history
        if (np) {
          const metaKey = `wh_pwmeta_${user.email}`;
          const meta = JSON.parse(localStorage.getItem(metaKey) || "[]");
          meta.unshift({
            date: new Date().toLocaleString(),
            hash: lightHash(np),
          });
          localStorage.setItem(metaKey, JSON.stringify(meta.slice(0, 10)));
          // update stored auth token too
          saveUser(user.email, np);
          document.getElementById("newPassword").value = "";
          document.getElementById("confirmPassword").value = "";
        }

        msg.textContent = "Profile saved (demo).";
        msg.className = "text-sm text-green-600";
        renderPwHistory();
      });

      document.getElementById("cancelProfile").addEventListener("click", () => {
        const p = loadProfile();
        document.getElementById("fullName").value = p.name || "";
        document.getElementById("dob").value = p.dob || "";
        document.getElementById("phone").value = p.phone || "";
        document.getElementById("address").value = p.address || "";
      });

      // Handle certificate uploads
      document.getElementById("uploadCert").addEventListener("click", () => {
        const f = document.getElementById("certFile").files[0];
        if (!f) {
          alert("Choose a file first");
          return;
        }
        const reader = new FileReader();
        reader.onload = function (ev) {
          const dataUrl = ev.target.result;
          const list = loadCerts();
          list.unshift({ name: f.name, ts: Date.now(), data: dataUrl });
          saveCerts(list);
          renderCerts();
          document.getElementById("certFile").value = "";
        };
        reader.readAsDataURL(f);
      });
    </script>
  </body>
</html>
