<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mind Hub - Doctor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/i18n.js"></script>
  </head>
  <body class="bg-gray-100 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto p-6">
      <a
        href="Dashboard.html"
        class="text-teal-600 hover:underline"
        data-i18n="back_dashboard"
        >← Back to Dashboard</a
      >
      <h1 class="text-2xl font-bold mt-4" data-i18n="site_name">Mind Hub</h1>
      <p class="text-gray-600 mt-1">Approve or reject session requests.</p>

      <div class="mt-6 bg-white rounded-lg shadow p-6">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700"
            >Doctor name (for demo)</label
          >
          <input
            id="doctorName"
            class="mt-1 block w-full rounded-md border-gray-200"
            placeholder="e.g., Dr. Sarah Lee"
          />
        </div>

        <div>
          <button
            id="loadPending"
            class="bg-teal-600 text-white px-4 py-2 rounded"
          >
            Load pending requests
          </button>
        </div>

        <ul id="pendingList" class="mt-4 space-y-3"></ul>
      </div>
    </div>

    <script>
      function loadBookings() {
        try {
          return JSON.parse(localStorage.getItem("wh_bookings_demo") || "[]");
        } catch (e) {
          return [];
        }
      }
      function saveBookings(list) {
        localStorage.setItem("wh_bookings_demo", JSON.stringify(list));
      }
      function getDoctors() {
        try {
          return JSON.parse(localStorage.getItem("wh_doctors_demo") || "[]");
        } catch (e) {
          return [];
        }
      }

      document.getElementById("loadPending").addEventListener("click", () => {
        const name = document.getElementById("doctorName").value.trim();
        if (!name) {
          alert("Enter doctor name for demo");
          return;
        }
        const bookings = loadBookings();
        const pending = bookings.filter(
          (b) =>
            b.status === "pending" &&
            b.doctorId &&
            name &&
            name.toLowerCase().includes("")
        );
        // show all pending (demo: doctorName used manually to approve)
        const ul = document.getElementById("pendingList");
        ul.innerHTML = "";
        bookings
          .filter((b) => b.status === "pending")
          .forEach((b) => {
            const li = document.createElement("li");
            li.className =
              "border rounded p-3 flex justify-between items-start";
            const left = document.createElement("div");
            left.innerHTML = `<div class="font-medium">${
              b.doctorId
            }</div><div class="text-sm text-gray-600">${new Date(
              b.datetime
            ).toLocaleString()}</div><div class="text-sm">Patient: ${
              b.patientEmail
            }</div>`;
            const right = document.createElement("div");
            const ap = document.createElement("button");
            ap.className = "bg-green-100 text-green-700 px-3 py-1 rounded mr-2";
            ap.textContent = "Approve";
            const rj = document.createElement("button");
            rj.className = "bg-red-100 text-red-700 px-3 py-1 rounded";
            rj.textContent = "Reject";
            ap.addEventListener("click", () => {
              b.status = "approved";
              saveBookings(bookings);
              alert("Approved");
              loadPendingRequests();
            });
            rj.addEventListener("click", () => {
              b.status = "cancelled";
              saveBookings(bookings);
              alert("Rejected");
              loadPendingRequests();
            });
            right.appendChild(ap);
            right.appendChild(rj);
            li.appendChild(left);
            li.appendChild(right);
            ul.appendChild(li);
          });
      });

      function loadPendingRequests() {
        const ul = document.getElementById("pendingList");
        ul.innerHTML = "";
        const bookings = loadBookings();
        bookings
          .filter((b) => b.status === "pending")
          .forEach((b) => {
            const li = document.createElement("li");
            li.className =
              "border rounded p-3 flex justify-between items-start";
            const left = document.createElement("div");
            left.innerHTML = `<div class="font-medium">${
              b.doctorId
            }</div><div class="text-sm text-gray-600">${new Date(
              b.datetime
            ).toLocaleString()}</div><div class="text-sm">Patient: ${
              b.patientEmail
            }</div>`;
            const right = document.createElement("div");
            const ap = document.createElement("button");
            ap.className = "bg-green-100 text-green-700 px-3 py-1 rounded mr-2";
            ap.textContent = "Approve";
            const rj = document.createElement("button");
            rj.className = "bg-red-100 text-red-700 px-3 py-1 rounded";
            rj.textContent = "Reject";
            ap.addEventListener("click", () => {
              b.status = "approved";
              saveBookings(bookings);
              alert("Approved");
              loadPendingRequests();
            });
            rj.addEventListener("click", () => {
              b.status = "cancelled";
              saveBookings(bookings);
              alert("Rejected");
              loadPendingRequests();
            });
            right.appendChild(ap);
            right.appendChild(rj);
            li.appendChild(left);
            li.appendChild(right);
            ul.appendChild(li);
          });
      }
    </script>
  </body>
</html>
